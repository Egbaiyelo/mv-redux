<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="./main.js"></script>
    <title>Example</title>
</head>
<body style="display: flex;"> 
    <!-- style display flex -->
    <canvas width="512" height="512"></canvas>

    <div id = "controlPanel" >

        <div>
            <div>
                <input type="range" id="rotateX" name="rotateX" min="0" max="3.14" step="0.05" />
                <label for="rotateX">rotateX</label>
            </div>
        
            <div>
                <input type="range" id="rotateY" name="rotateY" min="0" max="3.14" step="0.05" />
                <label for="rotateY">rotateY</label>
            </div>
        
            <div>
                <input type="range" id="rotateZ" name="rotateZ" min="0" max="3.14" step="0.05" />
                <label for="rotateZ">rotateZ</label>
            </div>
        </div>
        <div>
            <div>
                <input type="range" id="translateX" name="translateX" min="0" max="3.14" step="0.05" />
                <label for="translateX">translateX</label>
            </div>
        
            <div>
                <input type="range" id="translateY" name="translateY" min="0" max="3.14" step="0.05" />
                <label for="translateY">translateY</label>
            </div>
        
            <div>
                <input type="range" id="tranlateZ" name="tranlateZ" min="0" max="3.14" step="0.05" />
                <label for="tranlateZ">tranlateZ</label>
            </div>
        </div>
    </div>

</body>
</html>
